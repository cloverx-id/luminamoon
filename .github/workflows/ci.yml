name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "development" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "development" ]
  release:
    types: [published]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust Quality & Parity (${{ matrix.os }})
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting (cargo fmt)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Cargo Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Unit & Parity Tests
        run: cargo test --workspace --verbose

  type-check:
    name: Python Static Typing (Pyright)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Pyright Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.0.0"

      - name: Run Pyright
        run: npx pyright python/luminamoon

      - name: Verify Universal Fallback Wheel Builder
        run: |
          python tools/build_universal_wheel.py --out dist
          python -c "import zipfile, sys, tempfile; td = tempfile.TemporaryDirectory(); import glob; whl = glob.glob('dist/luminamoon-*-py3-none-any.whl')[0]; z = zipfile.ZipFile(whl); z.extractall(td.name); sys.path.insert(0, td.name); import luminamoon.optimizer.luminav as lum; import numpy as np; p = np.zeros(5, dtype=np.float32); opt = lum.LuminaV([p], lr=1e-3); opt.step(grads=[np.ones(5, dtype=np.float32)]); assert opt.state[p]['step'] == 1; print('Universal fallback verified successfully')"

  python-matrix:
    name: Python Tests (${{ matrix.os }}, Py${{ matrix.python-version }})
    if: github.event_name != 'release'
    needs: [rust-quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Upgrade Pip & Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin "numpy>=2.0.0" pytest

      - name: Build & Install LuminaMoon (Native CPython Extension)
        run: python tools/build_wheel.py --install

      - name: Run Standalone NumPy Verification
        run: python optimizer/tests/test_standalone_numpy.py

      - name: Run Data Modular Verification
        run: python -B tests/test_data_modular.py

      - name: Run Adversarial String Verification
        run: python -B tests/test_gpu_vs_cpu_strings.py

      - name: Install Optional PyTorch Dependency
        id: install-torch
        run: python -c "import os, subprocess, sys; r = subprocess.run([sys.executable, '-m', 'pip', 'install', 'torch>=2.0.0']); open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write(f'installed={str(r.returncode == 0).lower()}\n'); print('PyTorch installed:', r.returncode == 0)"


      - name: Run PyTorch End-to-End Training Tests
        if: steps.install-torch.outputs.installed == 'true'
        run: python optimizer/tests/test_end_to_end_training.py

      - name: Verify Universal Dynamic Fallback
        run: |
          python -c "import luminamoon.optimizer.luminav as lum; lum._luminamoon_rs = None; import numpy as np; p = np.zeros(10, dtype=np.float32); opt = lum.LuminaV([p], lr=1e-3); opt.step(grads=[np.ones(10, dtype=np.float32)]); assert opt.state[p]['step'] == 1; print('Dynamic fallback verified successfully')"

  free-threaded:
    name: Free-Threaded No-GIL (${{ matrix.python-version }})
    if: github.event_name != 'release'
    needs: [rust-quality]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python (Free-Threaded)
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Maturin
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Verify abi3t Wheel Compilation & Import
        run: |
          maturin build --release -i python --out dist
          pip install dist/*.whl
          python -c "import luminamoon.optimizer._luminamoon_optimizer_rs, sys; assert not sys._is_gil_enabled(), 'GIL must remain disabled'; print('Free-threaded abi3t extension verified successfully')"

  release-build:
    name: Distribution Wheel Build (${{ matrix.os }})
    needs: [python-matrix, type-check]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python for Build Scripts
        if: matrix.os == 'ubuntu-latest' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/sync_version.py "${{ github.ref_name }}"

      - name: Build Universal Pure-Python Fallback Wheel (py3-none-any)
        if: matrix.os == 'ubuntu-latest'
        run: python tools/build_universal_wheel.py --out dist

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist (Source Distribution)
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Build Wheel via Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  draft-release:
    name: Create Draft GitHub Release
    needs: [release-build]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all built wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

  publish-pypi:
    name: Publish Wheels to PyPI (on Release Publish)
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release assets via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.event.release.tag_name }}" --dir dist --pattern "*.whl" --pattern "*.tar.gz"
          ls -la dist

      - name: Publish Distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true