name: Documentation Portal (GitHub Pages)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "development" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs Material Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs-material>=9.5.0"

      - name: Prepare Documentation Stage & Normalize Math/Links
        run: python tools/prepare_mkdocs.py

      - name: Build Static Documentation Site
        run: mkdocs build

      - name: Upload GitHub Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
