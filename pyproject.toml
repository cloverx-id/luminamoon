[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "luminamoon"
version = "1.0.8"
description = "High-Performance Numerical Optimization, Multimodal Dataset Streaming, and Formal Verification Suite for PROJECT LOOMY"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Silver Moon", email = "leafmoon.idn@gmail.com" },
    { name = "Lumina Moon (cloverx-id) Contributors" },
]
keywords = [
    "optimizer",
    "deep-learning",
    "pytorch",
    "vulkan",
    "simd",
    "data-loader",
    "distributed-training",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cloverx-id/luminamoon"
Repository = "https://github.com/cloverx-id/luminamoon"
Issues = "https://github.com/cloverx-id/luminamoon/issues"
Documentation = "https://cloverx-id.github.io/luminamoon/"
Changelog = "https://github.com/cloverx-id/luminamoon/releases"

[project.optional-dependencies]
numpy = [
    "numpy>=2.0.0",
]
torch = [
    "torch>=2.0.0",
]
gpu = [
    "triton>=3.0.0; sys_platform != 'win32'",
    "triton-windows>=3.0.0; sys_platform == 'win32'",
]
all = [
    "numpy>=2.0.0",
    "torch>=2.0.0",
    "triton>=3.0.0; sys_platform != 'win32'",
    "triton-windows>=3.0.0; sys_platform == 'win32'",
]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.0.0",
    "pyright>=1.1.400",
]
eval = [
    "scipy>=1.15.0",
    "z3-solver>=5.3.0",
]

[tool.maturin]
manifest-path = "optimizer/Cargo.toml"
features = ["pyo3/abi3-py310", "pyo3/abi3t"]
module-name = "luminamoon.optimizer._luminamoon_optimizer_rs"
python-source = "python"
include = ["LICENSE"]

[tool.pyright]
include = ["python/luminamoon"]
reportMissingImports = "none"
reportMissingTypeStubs = false
reportOptionalMemberAccess = "none"
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
norecursedirs = ["target", ".git", "venv", ".venv", "optimizer", "data"]
filterwarnings = [
    "ignore::pytest.PytestReturnNotNoneWarning",
]
