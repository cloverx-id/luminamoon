[package]
name = "luminamoon-optimizer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "_luminamoon_optimizer_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
cubecl = ["luminav-dispatch/cubecl"]
cubecl-wgpu = ["cubecl", "luminav-dispatch/cubecl-wgpu"]
cubecl-vulkan = ["cubecl", "luminav-dispatch/cubecl-vulkan"]
cubecl-metal = ["cubecl", "luminav-dispatch/cubecl-metal"]
cubecl-cuda = ["cubecl", "luminav-dispatch/cubecl-cuda"]
cubecl-hip = ["cubecl", "luminav-dispatch/cubecl-hip"]
cubecl-cpu = ["cubecl", "luminav-dispatch/cubecl-cpu"]

[dependencies]
luminav-core = { path = "crates/luminav-core" }
luminav-simd = { path = "crates/luminav-simd" }
luminav-triton-aot = { path = "crates/luminav-triton-aot" }
luminav-dispatch = { path = "crates/luminav-dispatch" }
luminamoon-dataloader = { path = "../data" }
pyo3.workspace = true
rayon.workspace = true
