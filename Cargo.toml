[workspace]
resolver = "3"
members = [
    "optimizer",
    "optimizer/crates/*",
    "data",
]

[workspace.package]
version = "1.0.8-post.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Silver Moon <leafmoon.idn@gmail.com>", "Lumina Moon (cloverx-id) Contributors"]
repository = "https://github.com/cloverx-id/luminamoon"
homepage = "https://github.com/cloverx-id/luminamoon"

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310", "abi3t"] }
ash = "0.38.0"
libloading = "0.9.0"
rayon = "1.12.0"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
parquet = "60.0.0"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
arrow-ipc = "60.0.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
crc32fast = "1.5.2"
hashbrown = "0.17.1"
parking_lot = "0.12.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 16
panic = "abort"
strip = true
