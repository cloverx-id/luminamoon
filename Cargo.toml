[workspace]
resolver = "3"
members = [
    "optimizer",
    "optimizer/crates/*",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Silver Moon (cloverxion)", "Lumina Moon (cloverx-id)"]

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310", "abi3t"] }
ash = "0.38.0"
libloading = "0.9.0"
rayon = "1.12.0"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
